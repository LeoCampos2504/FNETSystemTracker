name: Verify operational controls
on:
  push:
    branches: [main, codex/insumos-coordinadores]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://fnet_test:fnet_test@127.0.0.1:5432/fnet_test
      NEXT_PUBLIC_USE_MOCK_API: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
      - run: npm run lint
      - run: npm run build
